name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nuhxboard-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nuhxboard-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nuhxboard-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nuhxboard-windows-x86_64
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxdo-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config
    
    - name: Check formatting
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo fmt --all -- --check
    
    - name: Run cargo check
      run: cargo check --all-targets --target ${{ matrix.target }}
    
    - name: Run cargo build (release)
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Run cargo test
      run: cargo test --target ${{ matrix.target }}
    
    - name: Prepare artifacts (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p artifacts
        if [ -f "target/${{ matrix.target }}/release/nuhxboard" ]; then
          cp target/${{ matrix.target }}/release/nuhxboard artifacts/${{ matrix.artifact_name }}
        fi
    
    - name: Prepare artifacts (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p artifacts
        if [ -f "target/${{ matrix.target }}/release/nuhxboard.exe" ]; then
          cp target/${{ matrix.target }}/release/nuhxboard.exe artifacts/${{ matrix.artifact_name }}.exe
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: artifacts/*
        if-no-files-found: warn
